<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic Intel Report Archive | AI ShieldPro</title>
  <meta name="description" content="Weekly AI-native threat intelligence from AI ShieldPro.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #03060a;
      --panel: rgba(8, 15, 23, 0.84);
      --line: rgba(138, 204, 232, 0.16);
      --text: #f5f8fb;
      --muted: #93a9b8;
      --accent: #92f3db;
      --accent-strong: #4ad8ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 12%, rgba(74, 216, 255, 0.12), transparent 26%),
        radial-gradient(circle at 82% 18%, rgba(146, 243, 219, 0.1), transparent 24%),
        linear-gradient(160deg, #04070b 0%, #06111a 55%, #020407 100%);
    }

    main {
      width: min(780px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    a {
      color: var(--accent);
    }

    .back {
      display: inline-flex;
      margin-bottom: 28px;
      color: var(--accent);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(12, 21, 31, 0.92), rgba(6, 11, 18, 0.8)), var(--panel);
      padding: 36px;
      box-shadow: 0 26px 90px rgba(0, 0, 0, 0.36);
    }

    h1 {
      margin: 0;
      font-family: "Plus Jakarta Sans", Manrope, sans-serif;
      font-size: clamp(2.4rem, 8vw, 4.7rem);
      line-height: 0.96;
      letter-spacing: -0.06em;
    }

    p {
      color: var(--muted);
      line-height: 1.75;
    }

    .status {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: #d6e5ed;
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../agentic-intel-report.html">Back to Report</a>
    <section class="panel">
      <h1>Agentic Intel Report Archive</h1>
      <p>
        Weekly AI-native threat intelligence covering jailbreak trends, MCP exposure,
        shadow AI, and emerging exploit movement.
      </p>
      <p class="status">
        The first generated issue will appear here after the automation runs.
      </p>
    </section>
  </main>
</body>
</html>
